version: "3.9"

services:
  nginx:
    image: nginx:1.22-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
    container_name: vite_gourmand_app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vite_gourmand_db
    environment:
      MYSQL_DATABASE: vite_gourmand
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
